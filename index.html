<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>番茄口袋版 V3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'] },
                    colors: {
                        pomo: { 
                            bg: '#FFF0F0',
                            red: '#FF6B6B',
                            dark: '#D63031',
                            rotten: '#8D6E63',
                            green: '#1DD1A1',
                            yellow: '#FDCB6E',
                            blue: '#48DBFB',
                            text: '#2D3436'
                        }
                    },
                    boxShadow: {
                        'soft': '0 4px 15px rgba(0,0,0,0.05)',
                        'btn': '0 4px 0px rgba(0,0,0,0.1)'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #FFF0F0; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .active-task { border: 2px solid #FF6B6B !important; background-color: #fff5f5 !important; }
        
        /* 红色删除线动画 */
        .strike-red {
            text-decoration: line-through;
            text-decoration-color: #FF6B6B;
            text-decoration-thickness: 3px;
            color: #b2bec3; /* 完成后文字变灰 */
            opacity: 0.8;
        }

        /* 烂番茄震动 */
        @keyframes rotShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-5deg); }
            75% { transform: translateX(5px) rotate(5deg); }
        }
        .rotten-trigger { animation: rotShake 0.4s ease-in-out; color: #8D6E63 !important; }
    </style>
</head>
<body class="h-screen flex flex-col text-pomo-text overflow-hidden">

    <div class="bg-white/90 backdrop-blur-md z-20 px-3 py-3 flex justify-between items-center shadow-sm shrink-0">
        <button onclick="exportCSV()" class="w-9 h-9 flex items-center justify-center bg-green-50 text-green-600 rounded-xl active:scale-95 transition-transform" title="导出Excel">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
        </button>

        <div class="flex items-center gap-2">
            <button onclick="changeDate(-1)" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full text-gray-500 font-bold active:bg-gray-200">‹</button>
            <div class="flex flex-col items-center relative" onclick="document.getElementById('datePicker').showPicker()">
                <div class="text-[10px] text-gray-400 uppercase tracking-widest font-black" id="dateLabel">TODAY</div>
                <input type="date" id="datePicker" onchange="jumpToDate(this.value)" class="absolute opacity-0 w-full h-full top-0 left-0 z-10">
                <div class="font-black text-lg leading-none text-pomo-text" id="displayDateStr">...</div>
            </div>
            <button onclick="changeDate(1)" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full text-gray-500 font-bold active:bg-gray-200">›</button>
        </div>

        <div class="w-9"></div>
    </div>

    <div class="bg-white rounded-b-[2rem] shadow-soft pt-2 pb-5 px-4 flex flex-col items-center shrink-0 z-10 transition-colors duration-500" id="timerContainer">
        
        <div class="w-full text-center mb-2 h-6">
            <div id="currentTaskDisplay" class="text-sm font-bold text-gray-400 truncate max-w-[85%] mx-auto">
                👇 点击下方任务开始
            </div>
        </div>

        <div class="relative w-40 h-40 flex justify-center items-center mb-4">
            <div id="pauseIndicator" class="absolute top-8 flex gap-1 opacity-0 transition-opacity">
                <span class="w-1.5 h-1.5 rounded-full bg-gray-200"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-gray-200"></span>
                <span class="w-1.5 h-1.5 rounded-full bg-gray-200"></span>
            </div>

            <div class="text-4xl font-black tabular-nums text-pomo-text tracking-tighter" id="timerDisplay">25:00</div>
            
            <svg class="absolute top-0 left-0 w-full h-full -rotate-90 pointer-events-none overflow-visible" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="46" stroke="#f3f4f6" stroke-width="5" fill="none" />
                <circle id="timerCircle" cx="50" cy="50" r="46" stroke="#FF6B6B" stroke-width="5" fill="none" 
                        stroke-dasharray="289" stroke-dashoffset="0" stroke-linecap="round" class="transition-all duration-1000 ease-linear"/>
            </svg>
        </div>

        <div class="flex gap-3 w-full max-w-[200px]">
            <button onclick="toggleTimer()" id="mainBtn" 
                class="flex-1 bg-pomo-red text-white text-base font-bold py-2 rounded-xl shadow-btn active:translate-y-1 active:shadow-none transition-all disabled:bg-gray-300 disabled:shadow-none">
                开始
            </button>
            <button onclick="resetTimer()" 
                class="px-4 bg-gray-100 text-gray-500 font-bold rounded-xl shadow-btn active:translate-y-1 active:shadow-none transition-all">
                ↺
            </button>
        </div>
    </div>

    <div class="flex-1 overflow-y-auto no-scrollbar p-4 flex flex-col gap-6" id="taskListContainer">
        
        <div class="flex flex-col gap-3">
            <div class="flex justify-between items-end px-2">
                <h2 class="font-bold text-pomo-red text-lg">📝 计划 (Planned)</h2>
                <span class="text-xs text-gray-400 font-bold" id="statSummary">0 / 0</span>
            </div>
            
            <div class="bg-white p-2 pl-3 rounded-xl shadow-sm flex items-center gap-2 border border-gray-100">
                <input type="text" id="planInput" placeholder="新任务..." class="flex-1 bg-transparent outline-none text-base h-10">
                <input type="number" id="planEst" value="1" class="w-8 text-center bg-gray-50 rounded h-8 text-sm font-bold text-gray-500">
                <button onclick="addTask('planned')" class="w-10 h-10 bg-pomo-red text-white rounded-lg font-bold text-xl active:scale-95 transition-transform">+</button>
            </div>

            <div id="plannedList" class="flex flex-col gap-3 pb-2 min-h-[50px]"></div>
        </div>

        <div class="flex flex-col gap-3 pb-20">
            <h2 class="font-bold text-pomo-blue text-lg px-2">⚡ 干扰 (Unplanned)</h2>
            
            <div class="bg-white p-2 pl-3 rounded-xl shadow-sm flex items-center gap-2 border border-gray-100">
                <input type="text" id="unplanInput" placeholder="临时插入..." class="flex-1 bg-transparent outline-none text-base h-10">
                <button onclick="addTask('unplanned')" class="w-10 h-10 bg-pomo-blue text-white rounded-lg font-bold text-xl active:scale-95 transition-transform">+</button>
            </div>

            <div id="unplannedList" class="flex flex-col gap-3 min-h-[50px]"></div>
        </div>
    </div>

    <script>
        const DB_KEY = 'pomo_mobile_v3_data';
        let currentDateStr = new Date().toISOString().split('T')[0];
        let currentDayData = { planned: [], unplanned: [] };
        
        // 计时器变量
        const WORK_TIME = 25 * 60;
        const BREAK_TIME = 5 * 60;
        let timeLeft = WORK_TIME;
        let timerId = null;
        let isWorkMode = true;
        let pauseCount = 0;
        let activeTaskId = null;
        let activeTaskType = null;

        window.onload = () => {
            loadData(currentDateStr);
            updateDateUI();
            initDragDrop();
        };

        // --- 数据存储 ---
        function loadData(dateStr) {
            const all = JSON.parse(localStorage.getItem(DB_KEY) || '{}');
            if (!all[dateStr]) all[dateStr] = { planned: [], unplanned: [] };
            currentDayData = all[dateStr];
            activeTaskId = null;
            resetTimerUI(); 
            render();
        }

        function saveData() {
            const all = JSON.parse(localStorage.getItem(DB_KEY) || '{}');
            all[currentDateStr] = currentDayData;
            localStorage.setItem(DB_KEY, JSON.stringify(all));
            updateStatsUI();
        }

        // --- 日期逻辑 (修复版) ---
        function changeDate(off) {
            const d = new Date(currentDateStr);
            d.setDate(d.getDate() + off);
            currentDateStr = d.toISOString().split('T')[0];
            updateDateUI();
            loadData(currentDateStr);
        }

        function jumpToDate(val) {
            if(val) {
                currentDateStr = val;
                updateDateUI();
                loadData(currentDateStr);
            }
        }

        function updateDateUI() {
            document.getElementById('datePicker').value = currentDateStr;
            const todayStr = new Date().toISOString().split('T')[0];
            
            let label = "";
            if (currentDateStr === todayStr) {
                label = "TODAY";
            } else if (currentDateStr < todayStr) {
                label = "HISTORY";
            } else {
                label = "FUTURE";
            }

            const d = new Date(currentDateStr);
            document.getElementById('dateLabel').innerText = label;
            document.getElementById('displayDateStr').innerText = `${d.getMonth()+1}.${d.getDate()}`;
            
            // 只有今天可以操作
            const isToday = (currentDateStr === todayStr);
            document.getElementById('mainBtn').disabled = !isToday;
            document.getElementById('planInput').disabled = !isToday;
            document.getElementById('unplanInput').disabled = !isToday;
        }

        // --- 导出逻辑 (Excel/CSV) ---
        function exportCSV() {
            const allData = JSON.parse(localStorage.getItem(DB_KEY) || '{}');
            // CSV BOM 头，解决Excel乱码问题
            let csvContent = "\uFEFF日期,任务类型,任务名称,预估番茄,实际完成,烂番茄,状态\n";

            // 遍历所有日期，按日期倒序
            const dates = Object.keys(allData).sort().reverse();
            
            dates.forEach(date => {
                const dayData = allData[date];
                // 遍历 Plan
                dayData.planned.forEach(t => {
                    const status = t.manualDone ? "已完成" : "进行中";
                    csvContent += `${date},计划任务,"${t.title}",${t.est},${t.done},${t.rotten || 0},${status}\n`;
                });
                // 遍历 Unplanned
                dayData.unplanned.forEach(t => {
                    const status = t.manualDone ? "已完成" : "进行中";
                    csvContent += `${date},干扰/临时,"${t.title}",0,${t.done},${t.rotten || 0},${status}\n`;
                });
            });

            // 创建下载
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `番茄记录导出_${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- 任务管理 ---
        function addTask(type) {
            const input = document.getElementById(type === 'planned' ? 'planInput' : 'unplanInput');
            const est = document.getElementById('planEst');
            const val = input.value.trim();
            if(!val) return;

            const task = {
                id: Date.now(),
                title: val,
                est: type === 'planned' ? parseInt(est.value) : 0,
                done: 0,
                rotten: 0,
                manualDone: false // 新增：手动完成状态
            };
            
            currentDayData[type].push(task);
            input.value = '';
            saveData();
            render();
        }

        function toggleDone(id, type, e) {
            e.stopPropagation();
            const task = currentDayData[type].find(x => x.id === id);
            if(task) {
                task.manualDone = !task.manualDone;
                saveData();
                render();
            }
        }

        function deleteTask(id, type, e) {
            e.stopPropagation();
            if(confirm('彻底删除这条任务？')) {
                currentDayData[type] = currentDayData[type].filter(x => x.id !== id);
                if(activeTaskId === id) {
                    activeTaskId = null;
                    document.getElementById('currentTaskDisplay').innerText = "👇 点击下方任务开始";
                }
                saveData();
                render();
            }
        }

        function selectTask(id, type) {
            if(currentDateStr !== new Date().toISOString().split('T')[0]) return;
            activeTaskId = id;
            activeTaskType = type;
            render();
            
            const t = currentDayData[type].find(x => x.id === id);
            const label = document.getElementById('currentTaskDisplay');
            label.innerText = `正在进行: ${t.title}`;
            label.className = "text-sm font-bold text-pomo-red truncate max-w-[85%] mx-auto";
        }

        // --- 拖拽 ---
        function initDragDrop() {
            const cfg = {
                group: 'tasks',
                delay: 150, 
                delayOnTouchOnly: true,
                touchStartThreshold: 5,
                animation: 150,
                ghostClass: 'opacity-50',
                onEnd: (evt) => {
                    const getIds = (elId) => Array.from(document.getElementById(elId).children).map(el => parseInt(el.dataset.id));
                    const all = [...currentDayData.planned, ...currentDayData.unplanned];
                    currentDayData.planned = getIds('plannedList').map(id => all.find(x=>x.id===id));
                    currentDayData.unplanned = getIds('unplannedList').map(id => all.find(x=>x.id===id));
                    saveData();
                    render();
                }
            };
            new Sortable(document.getElementById('plannedList'), cfg);
            new Sortable(document.getElementById('unplannedList'), cfg);
        }

        // --- 渲染 ---
        function render() {
            const pEl = document.getElementById('plannedList');
            const uEl = document.getElementById('unplannedList');
            pEl.innerHTML = ''; uEl.innerHTML = '';

            const makeCard = (t, type) => {
                const isActive = activeTaskId === t.id;
                const isDone = t.manualDone;
                
                const div = document.createElement('div');
                div.className = `bg-white p-3 rounded-xl border border-gray-100 shadow-sm flex flex-col gap-2 transition-all active:scale-[0.98] ${isActive ? 'active-task' : ''}`;
                div.dataset.id = t.id;
                div.onclick = () => selectTask(t.id, type);

                // 图标
                let icons = '';
                for(let i=0; i<(t.rotten||0); i++) icons += `<span class="text-lg leading-none select-none">🤢</span>`;
                const total = Math.max(t.est, t.done, 1);
                for(let i=0; i<total; i++) {
                    if(i < t.done) {
                        const color = (i >= t.est && t.est > 0) ? 'text-pomo-yellow' : 'text-pomo-red';
                        icons += `<svg class="w-5 h-5 ${color} inline" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>`;
                    } else if (i < t.est) {
                        icons += `<svg class="w-5 h-5 text-gray-200 inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>`;
                    }
                }

                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <span class="font-bold text-gray-700 leading-tight transition-all ${isDone ? 'strike-red' : ''}">${t.title}</span>
                        
                        <div class="flex gap-1 -mt-1 -mr-1">
                            <button onclick="toggleDone(${t.id}, '${type}', event)" class="w-8 h-8 flex items-center justify-center text-gray-300 hover:text-green-500 active:scale-90 transition-transform" title="标记为完成">
                                <svg class="w-6 h-6 ${isDone ? 'text-green-500' : ''}" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
                            </button>
                            <button onclick="deleteTask(${t.id}, '${type}', event)" class="w-8 h-8 flex items-center justify-center text-gray-300 hover:text-red-500 active:scale-90 transition-transform" title="删除">
                                <span class="text-xl">×</span>
                            </button>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-1">${icons}</div>
                `;
                return div;
            };

            currentDayData.planned.forEach(t => pEl.appendChild(makeCard(t, 'planned')));
            currentDayData.unplanned.forEach(t => uEl.appendChild(makeCard(t, 'unplanned')));
            updateStatsUI();
        }

        function updateStatsUI() {
            const done = [...currentDayData.planned, ...currentDayData.unplanned].reduce((a,b)=>a+b.done,0);
            const est = currentDayData.planned.reduce((a,b)=>a+b.est,0);
            document.getElementById('statSummary').innerText = `完成 ${done} / 预估 ${est}`;
        }

        // --- 计时器逻辑 ---
        function toggleTimer() {
            if(!activeTaskId && isWorkMode) return alert('先选个任务吧👇');
            timerId ? pauseTimer() : startTimer();
        }

        function startTimer() {
            const btn = document.getElementById('mainBtn');
            btn.innerText = '暂停';
            btn.classList.add('bg-pomo-dark');
            document.getElementById('pauseIndicator').style.opacity = isWorkMode ? 1 : 0;
            
            timerId = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                if(timeLeft <= 0) finishTimer();
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timerId);
            timerId = null;
            document.getElementById('mainBtn').innerText = '继续';
            document.getElementById('mainBtn').classList.remove('bg-pomo-dark');

            if(isWorkMode) {
                pauseCount++;
                updatePauseDots();
                if(pauseCount > 3) triggerRotten();
            }
        }

        function updatePauseDots() {
            const dots = document.getElementById('pauseIndicator').children;
            for(let i=0; i<3; i++) {
                dots[i].className = `w-1.5 h-1.5 rounded-full transition-colors ${i < pauseCount ? 'bg-pomo-rotten' : 'bg-gray-200'}`;
            }
        }

        function triggerRotten() {
            const display = document.getElementById('timerDisplay');
            display.innerText = "烂番茄";
            display.classList.add('rotten-trigger');
            
            const t = currentDayData[activeTaskType].find(x => x.id === activeTaskId);
            if(t) {
                t.rotten = (t.rotten || 0) + 1;
                saveData();
                render(); 
            }
            setTimeout(() => {
                resetTimerUI();
                display.classList.remove('rotten-trigger');
            }, 1000);
        }

        function finishTimer() {
            clearInterval(timerId);
            timerId = null;
            const audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
            audio.play().catch(()=>{});

            if(isWorkMode) {
                const t = currentDayData[activeTaskType].find(x => x.id === activeTaskId);
                if(t) { t.done++; saveData(); render(); }
                if(confirm('完成！休息一下？')) {
                    isWorkMode = false;
                    timeLeft = BREAK_TIME;
                    startTimer();
                } else resetTimerUI();
            } else {
                alert('休息结束！');
                resetTimerUI();
            }
        }

        function resetTimer() {
            if(timerId) clearInterval(timerId);
            resetTimerUI();
        }

        function resetTimerUI() {
            timerId = null;
            timeLeft = WORK_TIME;
            pauseCount = 0;
            isWorkMode = true;
            document.getElementById('mainBtn').innerText = '开始';
            document.getElementById('mainBtn').classList.remove('bg-pomo-dark');
            document.getElementById('pauseIndicator').style.opacity = 0;
            updatePauseDots();
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeLeft/60).toString().padStart(2,'0');
            const s = (timeLeft%60).toString().padStart(2,'0');
            document.getElementById('timerDisplay').innerText = `${m}:${s}`;
            const total = isWorkMode ? WORK_TIME : BREAK_TIME;
            const dash = 289;
            const off = dash - (timeLeft/total)*dash;
            const circle = document.getElementById('timerCircle');
            circle.style.strokeDashoffset = off;
            circle.setAttribute('stroke', isWorkMode ? '#FF6B6B' : '#1DD1A1');
        }
    </script>
</body>
</html>
